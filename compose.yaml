services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ECOROUTE_PROFILE: local
      LOCAL_DB_PATH: /app/work/ecoroute.sqlite3
    volumes:
      - local-data:/app/work
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  local-data:
