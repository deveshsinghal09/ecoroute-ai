[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoroute-ai"
version = "0.0.1"
description = "Phase 0 backend scaffold for pollution-aware routing in Delhi"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "boto3>=1.35.70,<2", "uvicorn>=0.32,<1", "mangum>=0.19,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]
infra = ["aws-cdk-lib>=2.170,<3", "constructs>=10,<11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
