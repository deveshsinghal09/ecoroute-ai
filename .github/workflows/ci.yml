name: local-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p ../work && npm run test:e2e
      - run: npx playwright test --config playwright.maps.config.ts
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - name: Install pinned CDK before deployment-command tests
        run: npm ci --ignore-scripts
      - run: python -m pytest -q
      - name: Pull official Python base with public-registry fallback
        run: |
          for base_candidate in public.ecr.aws/docker/library/python:3.11-slim mirror.gcr.io/library/python:3.11-slim docker.io/library/python:3.11-slim; do
            if docker pull "$base_candidate"; then
              docker tag "$base_candidate" ecoroute-python-base:ci
              exit 0
            fi
          done
          echo "All official Python base sources failed" >&2
          exit 1
      - run: docker build --build-arg PYTHON_BASE_IMAGE=ecoroute-python-base:ci -f Dockerfile.ml -t ecoroute-ml:ci .
      - run: ECOROUTE_TEST_ML_CONTAINER=true python -m pytest tests/test_ml_container.py -q
      - run: python scripts/smoke_local.py
      - run: python scripts/check_repo.py
      - run: python scripts/export_api.py && git diff --exit-code -- docs/openapi.json docs/FRONTEND_INTEGRATION.md examples
      - run: docker build --build-arg PYTHON_BASE_IMAGE=ecoroute-python-base:ci -t ecoroute-api:ci .
      - name: Container health and authorization smoke
        run: |
          docker run -d --name ecoroute-api -p 8000:8000 ecoroute-api:ci
          trap 'docker logs ecoroute-api; docker rm -f ecoroute-api' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://localhost:8000/api/v1/health && break; sleep 1; done
          curl -fsS http://localhost:8000/docs > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/wearables/latest)" = 401
      - run: python scripts/build_lambda.py
      - run: PYTHONPATH=build/lambda python -S -c "import pyarrow; import ecoroute.handlers.api; import ecoroute.handlers.ingestion; print('Linux asset imports passed')"
      - run: npm run synth
      - run: python scripts/security_review.py
