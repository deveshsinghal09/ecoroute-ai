name: local-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: docker build -f Dockerfile.ml -t ecoroute-ml:ci .
      - run: ECOROUTE_TEST_ML_CONTAINER=true python -m pytest tests/test_ml_container.py -q
      - run: python scripts/smoke_local.py
      - run: python scripts/check_repo.py
      - run: npm ci --ignore-scripts
      - run: python scripts/build_lambda.py
      - run: PYTHONPATH=build/lambda python -S -c "import pyarrow; import ecoroute.handlers.api; import ecoroute.handlers.ingestion; print('Linux asset imports passed')"
      - run: npm run synth
